<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sawang Daen Din Scheduler Pro v30.15</title>
  <link rel="icon" type="image/png" href="https://img2.pic.in.th/Gemini_Generated_Image_f6cimzf6cimzf6ci.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; font-size: 14px; }
    .tab-content { display: none; }
    .tab-active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Calendar */
    .calendar-day { min-height: 100px; border: 1px solid #e2e8f0; background: white; cursor: pointer; transition: all 0.15s; }
    .calendar-day:hover { background: #f8fafc; transform: scale(1.01); z-index: 10; }
    .tag-booking { font-size: 10px; padding: 2px 4px; border-radius: 4px; color: white; margin-bottom: 1px; font-weight: 700; }
    .type-ด { background: #1e40af; } .type-ช { background: #15803d; } .type-บ { background: #b45309; }
    .type-off, .type-vac, .type-อบรม, .type-VAC { background: #64748b; }
    
    /* Table Styling */
    .table-container { overflow-x: auto; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    .table-official { table-layout: fixed; border-collapse: collapse; width: 100%; font-size: 12px; min-width: 1250px; }
    .table-official th, .table-official td { border: 1px solid #cbd5e1; text-align: center; vertical-align: middle; overflow: hidden; }
    .table-official th { background-color: #f8fafc; font-weight: 800; padding: 6px 0.5px; color: #334155; }
    .table-official td { height: 40px; background: white; }
    
    /* Column Sizing */
    .col-id { width: 30px; } 
    .col-name { width: 145px; } 
    .col-pos { width: 75px; } 
    .col-day { width: 27px; }
    .col-stat { width: 22px; background-color: #f9fafb !important; font-size: 11px; } 
    .col-total { width: 48px; background-color: #eff6ff !important; border-left: 2px solid #3b82f6 !important; } 
    
    .bg-holiday { background-color: #e2e8f0 !important; color: #1e293b; font-weight: bold; } 
    .cell-booked { background-color: #f0f9ff !important; border: 2.5px solid #3b82f6 !important; }
    
    /* Bold & Large Font for Duty letters */
    .select-shift { 
      width: 100%; height: 100%; border: none; background: transparent; text-align: center; 
      font-weight: 800; appearance: none; cursor: pointer; font-size: 15px; color: #0f172a;
    }
    .select-shift:disabled { opacity: 1; color: #000; }
    
    .text-danger { color: #dc2626 !important; font-weight: 800; }
    .text-orange { color: #ea580c !important; font-weight: 800; }
    .text-success { color: #16a34a !important; font-weight: 800; }
    .summary-row { background-color: #f8fafc; font-weight: 800; font-size: 11px; }
    
    #watermark { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); font-size: 50px; color: rgba(220, 38, 38, 0.08); font-weight: 900; pointer-events: none; z-index: 50; text-align: center; width: 100%; }
    @media print { .no-print { display: none; } #watermark { display: block !important; } }
    .section-title { font-size: 11px; font-weight: 800; color: #475569; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 8px; }
  </style>
</head>
<body class="p-2 md:p-6">

  <nav class="max-w-full mx-auto flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-[2rem] shadow-sm mb-8 border border-slate-200 no-print gap-6">
    <div class="flex items-center gap-4">
      <img src="https://img2.pic.in.th/Gemini_Generated_Image_f6cimzf6cimzf6ci.png" class="w-16 h-16 rounded-2xl shadow-sm" alt="Logo">
      <div>
        <div class="font-bold text-xl text-slate-800 tracking-tight">Sawang Daen Din Scheduler <span class="text-blue-600">Pro</span></div>
        <div class="bg-indigo-600 text-white px-3 py-0.5 rounded-xl text-[11px] font-bold mt-1 uppercase">พิเศษปาริฉัตร-สงฆ์อาพาธ</div>
      </div>
    </div>
    <div class="flex gap-2 bg-slate-100 p-1.5 rounded-2xl">
      <button onclick="switchTab('booking')" class="tab-btn px-6 py-2.5 rounded-xl font-bold transition text-slate-600 hover:bg-white">📅 จองเวร</button>
      <button onclick="switchTab('schedule')" class="tab-btn px-6 py-2.5 rounded-xl font-bold transition text-slate-600 hover:bg-white">⚙️ จัดตาราง</button>
      <button onclick="switchTab('settings')" class="tab-btn px-6 py-2.5 rounded-xl font-bold transition text-slate-600 hover:bg-white">👥 รายชื่อ</button>
    </div>
  </nav>

  <div class="max-w-full mx-auto">
    <!-- Tab: Booking -->
    <div id="tab-booking" class="tab-content tab-active">
      <div class="bg-white p-6 rounded-[2rem] border border-slate-200 mb-6 shadow-sm no-print">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
          <div><label class="font-bold text-slate-400 mb-1 block uppercase text-[10px] tracking-widest">เลือกพนักงานหรือ Admin</label><select id="staffSelect" onchange="updateCurrentStaff()" class="w-full border-2 border-slate-100 p-3 rounded-2xl font-bold text-blue-700 bg-slate-50 outline-none focus:border-blue-400"></select></div>
          <div class="md:col-span-2 flex gap-3"><div class="flex-1"><label class="font-bold text-slate-400 mb-1 block text-[10px]">เดือน</label><select id="bookMonth" onchange="renderCalendar()" class="w-full border p-3 rounded-2xl font-bold outline-none"></select></div><div class="w-40"><label class="font-bold text-slate-400 mb-1 block text-[10px]">ปี พ.ศ.</label><select id="bookYear" onchange="renderCalendar()" class="w-full border p-3 rounded-2xl font-bold outline-none"><option value="2025">2568</option><option value="2026" selected>2569</option></select></div></div>
        </div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 bg-slate-300 gap-px rounded-[2rem] overflow-hidden border shadow-sm"></div>
    </div>

    <!-- Tab: Schedule -->
    <div id="tab-schedule" class="tab-content">
      <div class="bg-white p-5 rounded-[2rem] shadow-sm mb-6 border border-slate-200 no-print">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
          <div class="md:col-span-3 border-r pr-6">
            <div class="section-title">2. จำนวนวันทำการ</div>
            <div class="flex flex-col gap-2 mb-2"><select id="runMonth" onchange="handleMonthYearChange()" class="w-full border p-2.5 rounded-xl font-bold text-blue-600 outline-none"></select><select id="runYear" onchange="handleMonthYearChange()" class="w-full border p-2.5 rounded-xl font-bold bg-slate-50 outline-none"><option value="2025">2568</option><option value="2026" selected>2569</option></select></div>
            <div id="workDayDisplay" class="text-[13px] font-black text-indigo-700 bg-indigo-50 p-2.5 rounded-xl border border-indigo-100 text-center"></div>
          </div>
          <div class="md:col-span-5 bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-sm">
             <div class="section-title">1. เป้าหมายอัตรากำลัง (ด / ช / บ)</div>
             <div class="grid grid-cols-2 gap-4">
                <div><span class="text-[10px] font-bold text-blue-800 uppercase block mb-1 underline">วันธรรมดา</span>
                   <div class="grid grid-cols-3 gap-1 mb-1.5"><input id="q_wd_r_n" type="number" value="1" class="border p-2 text-center rounded-lg font-bold w-full"><input id="q_wd_r_m" type="number" value="3" class="border p-2 text-center rounded-lg font-bold w-full"><input id="q_wd_r_a" type="number" value="1" class="border p-2 text-center rounded-lg font-bold w-full"></div>
                   <div class="grid grid-cols-3 gap-1"><input id="q_wd_s_n" type="number" value="1" class="border p-2 text-center rounded-lg bg-amber-50 font-bold w-full"><input id="q_wd_s_m" type="number" value="1" class="border p-2 text-center rounded-lg bg-amber-50 font-bold w-full"><input id="q_wd_s_a" type="number" value="1" class="border p-2 text-center rounded-lg bg-amber-50 font-bold w-full"></div>
                </div>
                <div><span class="text-[10px] font-bold text-rose-800 uppercase block mb-1 underline">วันหยุด</span>
                   <div class="grid grid-cols-3 gap-1 mb-1.5"><input id="q_hd_r_n" type="number" value="1" class="border p-2 text-center rounded-lg font-bold w-full"><input id="q_hd_r_m" type="number" value="1" class="border p-2 text-center rounded-lg font-bold w-full"><input id="q_hd_r_a" type="number" value="1" class="border p-2 text-center rounded-lg font-bold w-full"></div>
                   <div class="grid grid-cols-3 gap-1"><input id="q_hd_s_n" type="number" value="1" class="border p-2 text-center rounded-lg bg-amber-50 font-bold w-full"><input id="q_hd_s_m" type="number" value="1" class="border p-2 text-center rounded-lg bg-amber-50 font-bold w-full"><input id="q_hd_s_a" type="number" value="1" class="border p-2 text-center rounded-lg bg-amber-50 font-bold w-full"></div>
                </div>
             </div>
          </div>
          <div class="md:col-span-4 flex flex-col gap-2">
            <div class="section-title">3. วันหยุดนักขัตฤกษ์</div>
            <div id="holidayCheck" class="flex flex-wrap gap-1 h-[40px] overflow-y-auto border p-1 rounded-xl bg-slate-50 text-[10px]"></div>
            <button onclick="processAuto()" class="bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition active:scale-95">🚀 เริ่มการคำนวณเวร (AI)</button>
            <div class="grid grid-cols-3 gap-1"><button onclick="clearScheduleUI()" class="bg-orange-500 text-white py-2 rounded-lg font-bold text-[10px] hover:bg-orange-600 transition shadow">🧹 ล้าง</button><button onclick="saveSchedule()" class="bg-emerald-600 text-white py-2 rounded-lg font-bold text-[10px] hover:bg-emerald-700 transition shadow">💾 บันทึก</button><button onclick="finalizeSchedule()" class="bg-purple-600 text-white py-2 rounded-lg font-bold text-[10px] hover:bg-purple-700 transition shadow">✅ เสร็จสิ้น</button></div>
          </div>
        </div>
      </div>

      <div id="report-view" class="bg-white p-5 md:p-10 rounded-[3rem] shadow-2xl border relative overflow-x-auto min-h-[700px]">
        <div class="text-center mb-6 relative z-10"><h2 class="text-xl font-bold underline underline-offset-4 tracking-tight uppercase">บัญชีแนบท้ายคำสั่งโรงพยาบาลสมเด็จพระยุพราชสว่างแดนดิน</h2><p id="sub-header" class="text-slate-600 font-bold mt-2 text-sm"></p></div>
        <div id="watermark">จัดเวรเสร็จสิ้น ห้ามแก้ไขในระบบ ลงชื่อ นัทธ์นรินทร</div>
        <div class="table-container"><table id="mainTable" class="table-official bg-white"><thead id="dutyHead"></thead><tbody id="dutyBody"></tbody></table></div>
        <div class="no-print mt-12 flex flex-wrap gap-4 justify-center"><button onclick="exportExcel()" class="bg-slate-800 text-white px-10 py-3 rounded-full font-bold hover:bg-slate-900 shadow-xl transition flex items-center gap-2">📊 Export Excel</button><button onclick="copyTableToClipboard()" class="bg-blue-600 text-white px-10 py-3 rounded-full font-bold hover:bg-blue-700 shadow-xl transition flex items-center gap-2">📋 คัดลอกตาราง</button></div>
      </div>
    </div>

    <!-- Settings Tab -->
    <div id="tab-settings" class="tab-content">
       <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border max-w-xl mx-auto"><h3 class="font-bold text-lg mb-6 text-slate-700 text-center uppercase tracking-widest">จัดการรายชื่อเจ้าหน้าที่</h3><div class="flex gap-4 mb-8"><input id="inName" placeholder="ชื่อ-นามสกุล" class="border p-4 rounded-xl flex-1 outline-none text-sm focus:ring-2 focus:ring-blue-400"><input id="inPos" placeholder="ตำแหน่ง" class="border p-4 rounded-xl w-40 outline-none text-sm focus:ring-2 focus:ring-blue-400"><button onclick="addStaff()" class="bg-blue-600 text-white px-8 rounded-xl font-black text-2xl hover:bg-blue-700 shadow transition">+</button></div><div id="staffList" class="divide-y max-h-[500px] overflow-y-auto pr-2"></div></div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyZgCWhHspAeFDKTHDQprJYXPy4nXzIGKplSg_rLNBcWRKr_7GfEK_dVZ6laXU8mco8Eg/exec";
    async function callAPI(action, method = 'POST', data = {}) { try { let url = WEB_APP_URL; let options = { method: 'POST', body: JSON.stringify({ action, ...data }) }; if (method === 'GET') { url += `?action=${action}`; for (let key in data) url += `&${key}=${encodeURIComponent(data[key])}`; options = { method: 'GET' }; } const response = await fetch(url, options); return await response.json(); } catch (err) { return null; } }

    let appData = { staff: [], bookings: [] };
    let currentSchedule = []; let currentWorkDays = 0; let currentTargets = []; let currentStaff = ""; let isFinished = false; let isAdmin = false;
    const mNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    const dNames = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];

    window.onload = () => { const now = new Date(); let m = now.getMonth() + 1; let y = now.getFullYear(); if (m > 11) { m = 0; y++; } ['bookMonth', 'runMonth'].forEach(id => { const el = document.getElementById(id); mNames.forEach((name, i) => { el.innerHTML += `<option value="${i}">${name}</option>`; }); el.value = m; }); ['bookYear', 'runYear'].forEach(id => { document.getElementById(id).value = y; }); refresh(); };
    async function refresh() { const data = await callAPI('getAppData', 'GET'); if (data) { appData = data; updateUI(); renderCalendar(); } }
    
    function updateUI() {
      const select = document.getElementById('staffSelect'); const list = document.getElementById('staffList');
      select.innerHTML = '<option value="">-- เลือกรายชื่อ --</option><option value="Admin" class="text-rose-600 font-bold">🔑 [ADMIN MODE]</option>'; 
      appData.staff.forEach(s => { select.innerHTML += `<option value="${s[0].trim()}">${s[0]}</option>`; });
      list.innerHTML = "";
      appData.staff.forEach(s => { list.innerHTML += `<div class="flex justify-between items-center p-3 hover:bg-slate-50 transition"><div><p class="font-bold text-slate-800 text-[15px]">${s[0]}</p><p class="text-[10px] text-slate-400 font-bold uppercase">${s[1] || ""}</p></div><button onclick="delStaff('${s[0]}')" class="text-rose-400 font-bold">ลบ</button></div>`; });
    }

    async function updateCurrentStaff() { 
      const val = document.getElementById('staffSelect').value;
      if (val === "Admin") {
        const { value: pass } = await Swal.fire({ title: 'Admin Login', input: 'password', inputPlaceholder: 'รหัสผ่าน 4 หลัก', showCancelButton: true });
        if (pass === '4028') { isAdmin = true; currentStaff = "Admin"; Swal.fire('Logged in as Admin', '', 'success'); } 
        else { isAdmin = false; document.getElementById('staffSelect').value = ""; currentStaff = ""; if(pass) Swal.fire('รหัสผ่านไม่ถูกต้อง', '', 'error'); }
      } else { isAdmin = false; currentStaff = val; }
      renderCalendar(); 
    }

    function switchTab(id) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('tab-active'));
      document.getElementById('tab-' + id).classList.add('tab-active');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('bg-white', 'text-blue-700', 'shadow-md'));
      const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.innerText.includes(id === 'booking' ? 'จอง' : id === 'schedule' ? 'จัดตาราง' : 'รายชื่อ'));
      if(activeBtn) activeBtn.classList.add('bg-white', 'text-blue-700', 'shadow-md');
      if(id === 'schedule') { buildHolidayChecks(); handleMonthYearChange(); }
    }

    async function handleMonthYearChange() {
      const m = document.getElementById('runMonth').value, y = document.getElementById('runYear').value;
      document.getElementById('sub-header').innerHTML = `ประจำเดือน ${mNames[m]} พ.ศ. ${parseInt(y)+543}`;
      await refresh(); 
      const savedData = await callAPI('loadSchedule', 'GET', { month: m, year: y });
      if (savedData) { 
        currentSchedule = savedData.schedule; 
        currentTargets = savedData.targets; 
        currentWorkDays = savedData.workDays; 
        isFinished = savedData.isFinished || false; 
        if (!isFinished) syncBookingsIntoSchedule();
      } else { currentSchedule = constructInitialDraft(m, y); isFinished = false; }
      updateWorkDayCount(); renderTable();
    }

    function syncBookingsIntoSchedule() {
      currentSchedule.forEach(day => {
        day.assignments.forEach(assign => {
          const booking = appData.bookings.find(b => b.date === day.date && b.name.trim() === assign.name.trim());
          if (booking) { assign.type = booking.type; assign.isBooked = true; } 
          else if (assign.isBooked) { assign.isBooked = false; }
        });
      });
    }

    function updateWorkDayCount() {
      const m = parseInt(document.getElementById('runMonth').value), y = parseInt(document.getElementById('runYear').value);
      const extraH = Array.from(document.querySelectorAll('.extra-h:checked')).map(el => el.value);
      const daysCount = new Date(y, m + 1, 0).getDate();
      let count = 0; for (let d = 1; d <= daysCount; d++) { const day = new Date(y, m, d).getDay(); if (day !== 0 && day !== 6 && !extraH.includes(d.toString().padStart(2, '0'))) count++; }
      currentWorkDays = count; document.getElementById('workDayDisplay').innerText = `วันทำการ: ${currentWorkDays} วัน`;
    }

    function buildHolidayChecks() {
       const m = parseInt(document.getElementById('runMonth').value), y = parseInt(document.getElementById('runYear').value);
       const container = document.getElementById('holidayCheck'); container.innerHTML = "";
       const daysCount = new Date(y, m+1, 0).getDate();
       for(let d=1; d<=daysCount; d++) {
         const isWeekend = new Date(y, m, d).getDay() === 0 || new Date(y, m, d).getDay() === 6;
         container.innerHTML += `<label class="${isWeekend ? 'opacity-30' : ''} px-1.5 py-0.5 border rounded bg-white font-bold text-[9px] cursor-pointer"><input type="checkbox" onchange="updateWorkDayCount(); renderTable();" value="${d.toString().padStart(2,'0')}" class="extra-h mr-1">${d}</label>`;
       }
    }

    function constructInitialDraft(m, y) {
      const daysCount = new Date(y, parseInt(m) + 1, 0).getDate(); let skeleton = [];
      for (let d = 1; d <= daysCount; d++) {
        const dStr = `${y}-${String(parseInt(m) + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        let dayAssigns = []; appData.staff.forEach(s => { 
          const booking = appData.bookings.find(b => b.date === dStr && b.name.trim() === s[0].trim());
          dayAssigns.push({ name: s[0].trim(), type: booking ? booking.type : 'off', isBooked: !!booking }); 
        });
        skeleton.push({ date: dStr, assignments: dayAssigns });
      }
      return skeleton;
    }

    function renderTable() {
      const m = document.getElementById('runMonth').value, y = document.getElementById('runYear').value;
      const extraH = Array.from(document.querySelectorAll('.extra-h:checked')).map(el => el.value);
      const daysCount = new Date(y, parseInt(m) + 1, 0).getDate();
      const head = document.getElementById('dutyHead'), body = document.getElementById('dutyBody');
      head.innerHTML = ""; body.innerHTML = "";
      document.getElementById('watermark').style.display = isFinished ? 'block' : 'none';

      let h1 = `<tr><th class="col-id" rowspan="3">#</th><th class="col-name" rowspan="3">ชื่อพนักงาน</th><th class="col-pos" rowspan="3">ตำแหน่ง</th>`, h2 = `<tr>`;
      for(let d=1; d<=daysCount; d++) {
        const dObj = new Date(y, m, d), isH = (dObj.getDay() === 0 || dObj.getDay() === 6 || extraH.includes(d.toString().padStart(2,'0')));
        h1 += `<th class="col-day ${isH ? 'bg-holiday' : ''}">${d}</th>`;
        h2 += `<th class="col-day ${isH ? 'bg-holiday' : ''}">${dNames[dObj.getDay()]}</th>`;
      }
      h1 += `<th colspan="5" class="col-total">สถิติปฏิบัติงาน</th><th class="col-total" rowspan="3">รวม</th></tr>`;
      h2 += `</tr><tr>`;
      for(let d=1; d<=daysCount; d++) h2 += `<th class="${(new Date(y, m, d).getDay() === 0 || new Date(y, m, d).getDay() === 6 || extraH.includes(d.toString().padStart(2,'0'))) ? 'bg-holiday' : ''}"></th>`;
      h2 += `<th class="col-stat">ด</th><th class="col-stat">ช</th><th class="col-stat">บ</th><th class="col-stat">V</th><th class="col-stat">อ</th></tr>`;
      head.innerHTML = h1 + h2;

      let dStats = Array.from({length: daysCount}, () => ({'ด':0, 'ช':0, 'บ':0, 'total':0}));
      appData.staff.forEach((s, idx) => {
        const staffName = s[0].trim();
        let row = `<tr><td>${idx+1}</td><td class="text-left font-bold px-3 truncate text-[14px]">${staffName}</td><td class="text-[9px] text-slate-400 font-bold truncate">${s[1] || ""}</td>`;
        let c = { d:0, m:0, a:0, v:0, t:0, total:0 };
        for(let d=1; d<=daysCount; d++) {
          const assign = currentSchedule[d-1]?.assignments.find(a => a.name.trim() === staffName);
          let val = (assign ? assign.type : "off").trim();
          
          if (val.includes('ด')) { c.d++; dStats[d-1]['ด']++; }
          if (val.includes('ช')) { c.m++; dStats[d-1]['ช']++; }
          if (val.includes('บ')) { c.a++; dStats[d-1]['บ']++; }
          if (val.toLowerCase().includes('vac')) { c.v++; }
          if (val.includes('อบรม')) { c.t++; }
          
          if (!['off','Off','',' '].includes(val)) {
             // นับยอดรวมเวรในแต่ละวัน (ดบ = 2 เวร เป็นต้น)
             let dailyLoad = (val.includes('ด')?1:0) + (val.includes('ช')?1:0) + (val.includes('บ')?1:0) + (val.toLowerCase().includes('vac')?1:0) + (val.includes('อบรม')?1:0);
             dStats[d-1]['total'] += dailyLoad;
          }
          const isH = (new Date(y, m, d).getDay() === 0 || new Date(y, m, d).getDay() === 6 || extraH.includes(d.toString().padStart(2,'0')));
          row += `<td class="${isH ? 'bg-holiday' : ''} ${assign?.isBooked ? 'cell-booked' : ''}"><select class="select-shift" onchange="handleShiftChange('${staffName}', ${d-1}, this)" ${isFinished ? 'disabled' : ''}>`;
          const shiftOptions = ["off", "ด", "ช", "บ", "ดบ", "ชบ", "ด*", "ช*", "บ*", "ด*บ", "ดบ*", "ช*บ", "ชบ*", "ด*บ*", "ช*บ*", "vac", "อบรม"];
          shiftOptions.forEach(o => { row += `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`; });
          row += `</select></td>`;
        }
        c.total = c.d + c.m + c.a + c.v + c.t;
        row += `<td class="col-stat font-bold text-slate-700">${c.d}</td><td class="col-stat font-bold text-slate-700">${c.m}</td><td class="col-stat font-bold text-slate-700">${c.a}</td><td class="col-stat font-bold text-slate-500">${c.v}</td><td class="col-stat font-bold text-slate-500">${c.t}</td><td class="col-total font-black text-blue-800 text-[14.5px]">${c.total}</td></tr>`;
        body.innerHTML += row;
      });
      
      ['ด','ช','บ','total'].forEach(type => {
        let label = (type === 'total' ? 'Σ ปฏิบัติงานรวม' : 'สรุปผลัด ' + type);
        let fRow = `<tr class="summary-row"><td colspan="3" class="text-right px-4">${label}</td>`;
        for(let d=0; d<daysCount; d++) {
          const val = dStats[d][type]; const target = currentTargets[d] ? (type === 'total' ? currentTargets[d]['ด'] + currentTargets[d]['ช'] + currentTargets[d]['บ'] : currentTargets[d][type]) : 0;
          let cl = val < target ? "text-danger" : (val > target ? "text-orange" : (type === 'total' ? "text-blue-700" : "text-success"));
          fRow += `<td class="${cl}">${val}</td>`;
        }
        fRow += `<td colspan="6"></td></tr>`; body.innerHTML += fRow;
      });
    }

    function renderCalendar() {
      const m = parseInt(document.getElementById('bookMonth').value), y = parseInt(document.getElementById('bookYear').value); const grid = document.getElementById('calendarGrid'); grid.innerHTML = ''; const first = new Date(y, m, 1).getDay(), daysCount = new Date(y, m + 1, 0).getDate();
      dNames.forEach(d => grid.innerHTML += `<div class="bg-white p-2 text-center text-xs font-black text-slate-500 border-b">${d}</div>`);
      for(let i=0; i<first; i++) grid.innerHTML += `<div class="calendar-day bg-slate-50 opacity-30"></div>`;
      for(let d=1; d<=daysCount; d++) { 
        const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; 
        const bks = appData.bookings.filter(b => b.date === dStr); 
        let bkHtml = bks.map(b => {
           let col = b.type.includes('ด') ? 'ด' : (b.type.includes('ช') ? 'ช' : (b.type.includes('บ') ? 'บ' : 'off'));
           return `<div class="tag-booking type-${col}">${b.name.split(' ')[0]} (${b.type})</div>`;
        }).join(''); 
        grid.innerHTML += `<div class="calendar-day p-2 text-left" onclick="showDayDetails('${dStr}')"><span class="text-[10px] font-bold text-slate-400">${d}</span><div class="flex flex-col">${bkHtml}</div></div>`; 
      }
    }

    async function showDayDetails(date) {
      const bks = appData.bookings.filter(b => b.date === date); 
      let html = `<div class="text-left overflow-x-auto border rounded-2xl shadow-inner mb-4 bg-slate-50"><table class="w-full text-xs"><thead><tr class="bg-slate-200"><th class="p-2 text-left">เจ้าหน้าที่</th><th class="p-2 text-center">เวร</th>${isAdmin ? '<th class="p-2">จัดการ</th>' : ''}</tr></thead><tbody>`;
      if (bks.length === 0) html += `<tr><td colspan="${isAdmin?3:2}" class="p-6 text-center italic text-slate-400">ไม่มีข้อมูล</td></tr>`; 
      else bks.forEach(b => { 
        let col = b.type.includes('ด') ? 'ด' : (b.type.includes('ช') ? 'ช' : (b.type.includes('บ') ? 'บ' : 'off'));
        html += `<tr class="border-b"><td class="p-2 font-bold text-slate-700 text-[13px]">${b.name}</td><td class="p-2 text-center"><span class="tag-booking type-${col} px-2 py-0.5 inline-block rounded shadow-sm">${b.type}</span></td>${isAdmin ? `<td class="p-2 text-center whitespace-nowrap"><button onclick="adminEditBook('${date}', '${b.name}', '${b.type}')" class="admin-btn-edit">แก้ไข</button><button onclick="adminDelBook('${date}', '${b.name}')" class="admin-btn-del">ลบ</button></td>` : ''}</tr>`; 
      });
      html += `</tbody></table></div>`;
      const myBk = bks.find(b => b.name.trim() === currentStaff.trim());
      const res = await Swal.fire({ title: `🗓️ ${date}`, html, showCancelButton: true, confirmButtonText: isAdmin ? 'จองใหม่' : (myBk ? 'แก้ไข' : 'จองเวร'), confirmButtonColor: '#3b82f6', showDenyButton: !!myBk && !isAdmin, denyButtonText: 'ลบรายการ' });
      if (res.isConfirmed) submitBook(date, myBk ? myBk.type : ""); else if (res.isDenied) delBook(date);
    }

    async function adminEditBook(date, name, currentVal) {
      const { value: type } = await Swal.fire({ title: `แก้ไขเวร: ${name}`, input: 'select', inputOptions: { 'ด':'ด','ช':'ช','บ':'บ','off':'off','vac':'vac','อบรม':'อบรม' }, inputValue: currentVal.toLowerCase(), showCancelButton: true });
      if(type) { await callAPI('deleteBooking', 'POST', { date, name }); await callAPI('saveBooking', 'POST', { data: {date, name, type} }); refresh(); }
    }

    async function submitBook(date, existing = "") {
      if(!currentStaff && !isAdmin) return Swal.fire('เลือกชื่อก่อนดำเนินการ', '', 'warning');
      let targetName = currentStaff;
      if (isAdmin) {
        const staffOptions = {}; appData.staff.forEach(s => staffOptions[s[0].trim()] = s[0]);
        const { value: sName } = await Swal.fire({ title: 'จองเวรให้พนักงาน', input: 'select', inputOptions: staffOptions, showCancelButton: true });
        if(!sName) return; targetName = sName;
      }
      const { value: type } = await Swal.fire({ title: 'ระบุเวร', input: 'select', inputOptions: { 'ด':'ด','ช':'ช','บ':'บ','off':'off','vac':'vac','อบรม':'อบรม' }, inputValue: existing, showCancelButton: true });
      if(type) { if(existing || isAdmin) await callAPI('deleteBooking', 'POST', { date, name: targetName }); await callAPI('saveBooking', 'POST', { data: {date, name: targetName, type} }); refresh(); }
    }

    async function adminDelBook(date, name) { if(await Swal.fire({ title: 'ลบเวรนี้?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626' }).then(r=>r.isConfirmed)) { await callAPI('deleteBooking', 'POST', { date, name }); refresh(); Swal.close(); }}
    async function delBook(date) { if(await Swal.fire({ title: 'ลบรายการจอง?', icon: 'question', showCancelButton: true }).then(r=>r.isConfirmed)) { await callAPI('deleteBooking', 'POST', { date, name: currentStaff }); refresh(); }}

    function handleShiftChange(name, dIdx, el) {
      if(isFinished) { el.value = currentSchedule[dIdx].assignments.find(a => a.name === name).type; return; }
      let existing = currentSchedule[dIdx].assignments.find(a => a.name.trim() === name.trim());
      if (existing) { 
        if (existing.isBooked && !['vac','อบรม','off'].includes(el.value.toLowerCase())) { Swal.fire('ห้ามทับเวรจอง!', 'รายการนี้ล็อกไว้ตามระบบจองเวร กรุณาลบในปฏิทินก่อนแก้ไข', 'warning'); el.value = existing.type; return; }
        existing.type = el.value; 
      }
      renderTable();
    }

    function clearScheduleUI() {
      if (isFinished) return Swal.fire('ล็อกตารางแล้ว', '', 'warning');
      Swal.fire({ title: 'ล้างตารางจัดเวร?', text: "เวรที่ AI จัดไว้จะหายไปทั้งหมด ยกเว้นเวรจองและเวรลา", icon: 'warning', showCancelButton: true, confirmButtonColor: '#f97316' }).then((result) => {
        if (result.isConfirmed) {
          currentSchedule.forEach(day => { day.assignments.forEach(a => { if(!a.isBooked && !['vac','vac','อบรม'].includes(a.type.toLowerCase())) a.type = 'off'; }); });
          renderTable();
        }
      });
    }

    async function processAuto() {
      if (isFinished) return Swal.fire('ล็อกตารางแล้ว', '', 'warning');
      const m = document.getElementById('runMonth').value, y = document.getElementById('runYear').value, extraH = Array.from(document.querySelectorAll('.extra-h:checked')).map(el => el.value);
      const q = { wd_r_n: document.getElementById('q_wd_r_n').value, wd_r_m: document.getElementById('q_wd_r_m').value, wd_r_a: document.getElementById('q_wd_r_a').value, wd_s_n: document.getElementById('q_wd_s_n').value, wd_s_m: document.getElementById('q_wd_s_m').value, wd_s_a: document.getElementById('q_wd_s_a').value, hd_r_n: document.getElementById('q_hd_r_n').value, hd_r_m: document.getElementById('q_hd_r_m').value, hd_r_a: document.getElementById('q_hd_r_a').value, hd_s_n: document.getElementById('q_hd_s_n').value, hd_s_m: document.getElementById('q_hd_s_m').value, hd_s_a: document.getElementById('q_hd_s_a').value };
      Swal.fire({ title: 'AI กำลังจัดเวร...', text: 'เน้นความหลากหลายและรักษาสิทธิการพัก', didOpen: () => Swal.showLoading(), showConfirmButton: false });
      const res = await callAPI('generate', 'POST', { month: m, year: y, extraHolidays: extraH, q });
      if (res) { currentSchedule = res.schedule; currentTargets = res.targets; renderTable(); }
      Swal.close(); 
    }

    async function saveSchedule() {
      const m = document.getElementById('runMonth').value, y = document.getElementById('runYear').value;
      await callAPI('saveSchedule', 'POST', { month: m, year: y, schedule: currentSchedule, targets: currentTargets, workDays: currentWorkDays, isFinished: isFinished });
      Swal.fire('บันทึกสำเร็จ', '', 'success');
    }

    async function finalizeSchedule() { if(await Swal.fire({ title: 'จัดเวรเสร็จสิ้น?', text: 'ตารางจะถูกล็อกถาวร', icon: 'question', showCancelButton: true, confirmButtonColor: '#9333ea' }).then(r=>r.isConfirmed)) { isFinished = true; await saveSchedule(); renderTable(); }}
    function exportExcel() { const table = document.getElementById("mainTable"), tableClone = table.cloneNode(true); tableClone.querySelectorAll('select').forEach(sel => { sel.parentNode.replaceChild(document.createTextNode(sel.value), sel); }); XLSX.writeFile(XLSX.utils.table_to_book(tableClone), `Duty_Schedule_v30.15.xlsx`); }

    function copyTableToClipboard() {
      const table = document.getElementById("mainTable");
      const clone = table.cloneNode(true);
      clone.querySelectorAll('select').forEach(sel => { sel.parentNode.replaceChild(document.createTextNode(sel.value), sel); });
      const div = document.createElement('div'); div.style.position = 'absolute'; div.style.left = '-9999px';
      div.appendChild(clone); document.body.appendChild(div);
      const range = document.createRange(); range.selectNode(clone);
      window.getSelection().removeAllRanges(); window.getSelection().addRange(range);
      try { document.execCommand('copy'); Swal.fire({ title: 'คัดลอกสำเร็จ', text: 'วางใน Word หรือ Excel ได้ทันที', icon: 'success', timer: 1200 }); } catch (err) { Swal.fire('ไม่สำเร็จ', '', 'error'); }
      window.getSelection().removeAllRanges(); document.body.removeChild(div);
    }
    async function addStaff() { const n = document.getElementById('inName').value.trim(), p = document.getElementById('inPos').value.trim(); if (!n) return; await callAPI('manageStaff', 'POST', { subAction: 'add', data: {name: n, pos: p} }); document.getElementById('inName').value = ""; refresh(); }
    async function delStaff(n) { if(await Swal.fire({ title: 'ลบพนักงาน?', text: n, icon: 'warning', showCancelButton: true }).then(r=>r.isConfirmed)) { await callAPI('manageStaff', 'POST', { subAction: 'delete', data: {name: n} }); refresh(); }}
  </script>
</body>
