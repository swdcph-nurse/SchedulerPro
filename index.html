<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sawang Daen Din Scheduler Pro</title>
  
  <!-- Icon บน Tab bar (Favicon) -->
  <link rel="icon" type="image/png" href="https://e1.pngegg.com/pngimages/759/630/png-clipart-calendrier-date-du-calendrier-symbole-bleu-texte-ligne-zone-rectangle.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    .tab-content { display: none; }
    .tab-active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .calendar-day { min-height: 120px; border: 1px solid #e2e8f0; background: white; transition: 0.2s; position: relative; }
    .calendar-day:hover { background: #f1f5f9; cursor: pointer; }
    .tag-booking { font-size: 10px; padding: 2px 4px; border-radius: 4px; color: white; margin-bottom: 2px; line-height: 1.2; }
    
    .type-ด { background: #1e40af; } .type-ช { background: #15803d; } .type-บ { background: #b45309; }
    .type-ดบ { background: #6366f1; } .type-ชบ { background: #0891b2; }
    .type-Off, .type-VAC, .type-อบรม { background: #be123c; }
    
    .table-official th, .table-official td { border: 1px solid #94a3b8; text-align: center; padding: 2px; vertical-align: middle; }
    .table-official th { background-color: #f1f5f9; font-weight: 700; color: #1e293b; }
    
    .bg-holiday { background-color: #cbd5e1 !important; color: #000; font-weight: bold; } 
    .cell-booked { background-color: #e0f2fe !important; border: 2.5px solid #0ea5e9 !important; }
    
    .select-shift { 
      width: 100%; border: none; background: transparent; text-align: center; cursor: pointer; 
      font-size: 10px; font-weight: 800; padding: 4px 0; outline: none; appearance: none; color: #334155;
    }
    .select-shift:focus { background: #ffffff; border-radius: 4px; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5); }
    
    @media print { .no-print { display: none; } }
  </style>
</head>
<body class="p-4 md:p-8">
  <!-- ส่วนหัวเพจ (Header) -->
  <nav class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-5 rounded-2xl shadow-sm mb-6 border border-slate-200 no-print gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-blue-50 p-2 rounded-xl border border-blue-100">
        <img src="https://img5.pic.in.th/file/secure-sv1/hospital-icon.png" class="w-10 h-10 object-contain shadow-sm" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3063/3063176.png'">
      </div>
      <div class="flex flex-col gap-0.5">
        <div class="font-bold text-xl text-slate-800 leading-tight">Sawang Daen Din Scheduler <span class="text-blue-600 font-light text-base">Pro</span></div>
        <div class="text-sm font-bold text-slate-500">ระบบจัดเวรพนักงานช่วยเหลือคนไข้</div>
        <div class="text-[11px] mt-1 font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg w-fit">หน่วยงาน: พิเศษปาริฉัตร-สงฆ์อาพาธ</div>
      </div>
    </div>
    <div class="flex gap-2 bg-slate-100 p-1 rounded-xl self-end md:self-auto">
      <button onclick="switchTab('booking')" class="tab-btn px-4 py-2 rounded-lg font-semibold transition text-slate-600">เลือกจองเวร</button>
      <button onclick="switchTab('schedule')" class="tab-btn px-4 py-2 rounded-lg font-semibold transition text-slate-600">จัดตารางเวร</button>
      <button onclick="switchTab('settings')" class="tab-btn px-4 py-2 rounded-lg font-semibold transition text-slate-600">ตั้งค่า</button>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto">
    <!-- หน้าจองเวร -->
    <div id="tab-booking" class="tab-content tab-active">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-6 no-print">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
          <div>
            <label class="font-bold text-slate-400 mb-1 block uppercase text-[10px]">ระบุตัวตนพนักงาน (เพื่อระบุตัวตน)</label>
            <select id="staffSelect" onchange="updateCurrentStaff()" class="w-full border-2 border-slate-100 p-2 rounded-xl outline-none focus:border-blue-500 font-bold text-blue-700"></select>
          </div>
          <div class="md:col-span-2 flex gap-2">
            <div class="flex-1">
              <label class="font-bold text-slate-400 mb-1 block uppercase text-[10px]">เดือน</label>
              <select id="bookMonth" onchange="renderCalendar()" class="w-full border p-2 rounded-xl text-sm"></select>
            </div>
            <div class="w-32">
              <label class="font-bold text-slate-400 mb-1 block uppercase text-[10px]">ปี พ.ศ.</label>
              <select id="bookYear" onchange="renderCalendar()" class="w-full border p-2 rounded-xl text-sm">
                <option value="2024">2567</option><option value="2025">2568</option>
                <option value="2026" selected>2569</option><option value="2027">2570</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div id="calendarContainer" class="bg-white rounded-3xl overflow-hidden border border-slate-200 shadow-sm">
        <div id="calendarGrid" class="grid grid-cols-7 bg-slate-200 gap-px"></div>
      </div>
    </div>

    <!-- หน้าจัดตารางเวร -->
    <div id="tab-schedule" class="tab-content">
      <div class="bg-white p-6 rounded-3xl shadow-sm mb-6 border border-slate-200 no-print text-[11px]">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
          <!-- เลือกเดือน/ปี -->
          <div class="md:col-span-2">
            <label class="font-bold text-slate-400 mb-1 block text-[10px] uppercase tracking-wider">ระยะเวลา</label>
            <div class="flex flex-col gap-1">
              <select id="runMonth" onchange="handleMonthYearChange()" class="border p-2 rounded-lg w-full text-xs font-bold"></select>
              <select id="runYear" onchange="handleMonthYearChange()" class="border p-2 rounded-lg text-xs font-bold bg-slate-50">
                <option value="2024">2567</option><option value="2025">2568</option>
                <option value="2026" selected>2569</option><option value="2027">2570</option>
              </select>
            </div>
          </div>

          <!-- อัตรากำลัง วันทำการ -->
          <div class="md:col-span-3">
             <div class="text-center mb-1">
               <label class="font-bold text-blue-600 block text-[10px] uppercase">วันทำการ (จ-ศ)</label>
               <span class="text-[9px] text-slate-400 italic">ดึก | เช้า | บ่าย</span>
             </div>
             <div class="grid grid-cols-3 gap-1 mb-1">
               <input id="q_wd_r_n" type="number" value="1" class="border p-1 text-center rounded-lg focus:ring-2 focus:ring-blue-300 outline-none" title="จริง-ดึก">
               <input id="q_wd_r_m" type="number" value="2" class="border p-1 text-center rounded-lg focus:ring-2 focus:ring-blue-300 outline-none" title="จริง-เช้า">
               <input id="q_wd_r_a" type="number" value="2" class="border p-1 text-center rounded-lg focus:ring-2 focus:ring-blue-300 outline-none" title="จริง-บ่าย">
             </div>
             <div class="grid grid-cols-3 gap-1">
               <input id="q_wd_s_n" type="number" value="0" class="border p-1 text-center rounded-lg bg-amber-50 outline-none" title="เสริม-ดึก">
               <input id="q_wd_s_m" type="number" value="0" class="border p-1 text-center rounded-lg bg-amber-50 outline-none" title="เสริม-เช้า">
               <input id="q_wd_s_a" type="number" value="1" class="border p-1 text-center rounded-lg bg-amber-50 outline-none" title="เสริม-บ่าย">
             </div>
          </div>

          <!-- อัตรากำลัง วันหยุด -->
          <div class="md:col-span-3">
             <div class="text-center mb-1">
               <label class="font-bold text-rose-600 block text-[10px] uppercase">วันหยุด (ส-อา)</label>
               <span class="text-[9px] text-slate-400 italic">ดึก | เช้า | บ่าย</span>
             </div>
             <div class="grid grid-cols-3 gap-1 mb-1">
               <input id="q_hd_r_n" type="number" value="1" class="border p-1 text-center rounded-lg focus:ring-2 focus:ring-rose-300 outline-none" title="หยุด-จริง-ดึก">
               <input id="q_hd_r_m" type="number" value="1" class="border p-1 text-center rounded-lg focus:ring-2 focus:ring-rose-300 outline-none" title="หยุด-จริง-เช้า">
               <input id="q_hd_r_a" type="number" value="1" class="border p-1 text-center rounded-lg focus:ring-2 focus:ring-rose-300 outline-none" title="หยุด-จริง-บ่าย">
             </div>
             <div class="grid grid-cols-3 gap-1">
               <input id="q_hd_s_n" type="number" value="0" class="border p-1 text-center rounded-lg bg-amber-50 outline-none" title="หยุด-เสริม-ดึก">
               <input id="q_hd_s_m" type="number" value="1" class="border p-1 text-center rounded-lg bg-amber-50 outline-none" title="หยุด-เสริม-เช้า">
               <input id="q_hd_s_a" type="number" value="1" class="border p-1 text-center rounded-lg bg-amber-50 outline-none" title="หยุด-เสริม-บ่าย">
             </div>
          </div>

          <!-- วันหยุดพิเศษ -->
          <div class="md:col-span-2">
             <label class="font-bold text-slate-400 mb-1 block text-[10px] uppercase">วันหยุดพิเศษ</label>
             <div id="holidayCheck" class="flex flex-wrap gap-1 h-[68px] overflow-y-auto border p-1 rounded-lg bg-slate-50 border-dashed border-slate-300"></div>
          </div>

          <!-- ปุ่มดำเนินการ -->
          <div class="md:col-span-2 flex flex-col gap-1.5">
            <button onclick="processAuto()" class="bg-indigo-600 text-white py-2 rounded-xl font-bold hover:bg-indigo-700 shadow-md transition-all active:scale-95 text-[10px]">จัดเวรอัตโนมัติ</button>
            <div class="grid grid-cols-2 gap-1.5">
              <button onclick="clearScheduleUI()" class="bg-orange-500 text-white py-2 rounded-xl font-bold hover:bg-orange-600 transition-all text-[10px]">ล้างข้อมูล</button>
              <button onclick="saveSchedule()" class="bg-emerald-600 text-white py-2 rounded-xl font-bold hover:bg-emerald-700 transition-all text-[10px]">บันทึก</button>
            </div>
          </div>
        </div>
      </div>

      <div id="report-view" class="bg-white p-4 md:p-8 rounded-3xl shadow-xl overflow-x-auto border border-slate-100 min-h-[400px]">
        <div class="text-center mb-6">
          <h2 class="text-md font-bold text-slate-900 uppercase tracking-tight">บัญชีแนบท้ายคำสั่งโรงพยาบาลสมเด็จพระยุพราชสว่างแดนดิน</h2>
          <p id="sub-header" class="text-[11px] text-slate-600 font-bold mt-1"></p>
        </div>
        <table id="mainTable" class="table-official w-full text-[9px] bg-white border-collapse">
          <thead id="dutyHead"></thead>
          <tbody id="dutyBody"></tbody>
        </table>
        <div class="no-print mt-8 text-center">
            <button onclick="exportExcel()" class="bg-slate-800 text-white px-8 py-3 rounded-2xl font-bold text-sm tracking-widest uppercase shadow-lg hover:bg-slate-900 transition-all flex items-center gap-2 mx-auto">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
              Export to Excel
            </button>
        </div>
      </div>
    </div>

    <!-- หน้าจัดการรายชื่อ -->
    <div id="tab-settings" class="tab-content">
       <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 max-w-2xl mx-auto">
          <h3 class="font-bold text-lg mb-6 flex items-center gap-2 text-slate-700">👥 จัดการรายชื่อพนักงาน</h3>
          <div class="flex gap-2 mb-6">
            <input id="inName" placeholder="ชื่อ-นามสกุล" class="border p-3 rounded-xl flex-1 outline-none focus:ring-2 focus:ring-blue-400">
            <input id="inPos" placeholder="ตำแหน่ง" class="border p-3 rounded-xl w-40 outline-none focus:ring-2 focus:ring-blue-400">
            <button onclick="addStaff()" class="bg-blue-600 text-white px-6 rounded-xl font-bold hover:bg-blue-700 transition">+</button>
          </div>
          <div id="staffList" class="divide-y divide-slate-100 max-h-[450px] overflow-y-auto pr-2"></div>
       </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyZgCWhHspAeFDKTHDQprJYXPy4nXzIGKplSg_rLNBcWRKr_7GfEK_dVZ6laXU8mco8Eg/exec";

    async function callAPI(action, method = 'GET', data = {}) {
      try {
        let url = WEB_APP_URL;
        let options = { method: 'POST', body: JSON.stringify({ action, ...data }) };
        if (method === 'GET') {
          url += `?action=${action}`;
          for (let key in data) url += `&${key}=${encodeURIComponent(data[key])}`;
          options = { method: 'GET' };
        }
        const response = await fetch(url, options);
        return await response.json();
      } catch (err) {
        console.error("API Connection Error:", err);
        return null;
      }
    }

    let appData = { staff: [], bookings: [] };
    let currentSchedule = [];
    let currentWorkDays = 0;
    let currentTargets = [];
    let currentStaff = "";
    const mNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    const dNames = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];

    window.onload = () => {
      ['bookMonth', 'runMonth'].forEach(id => {
        const el = document.getElementById(id);
        mNames.forEach((m, i) => { el.innerHTML += `<option value="${i}">${m}</option>`; });
      });
      refresh();
    };

    async function refresh() { 
      const data = await callAPI('getAppData', 'GET');
      if (data) { appData = data; updateUI(); renderCalendar(); }
    }

    function switchTab(id) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('tab-active'));
      document.getElementById('tab-' + id).classList.add('tab-active');
      document.querySelectorAll('.tab-btn').forEach(btn => btn.className = "tab-btn px-4 py-2 rounded-lg font-semibold transition text-slate-600");
      const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.innerText.includes(id === 'booking' ? 'เลือกจอง' : id === 'schedule' ? 'จัดตาราง' : 'ตั้งค่า'));
      if(activeBtn) activeBtn.className = "tab-btn px-4 py-2 rounded-lg font-semibold transition bg-white text-blue-600 shadow-sm";
      if(id === 'schedule') { buildHolidayChecks(); handleMonthYearChange(); }
      if(id === 'booking') renderCalendar();
    }

    function updateUI() {
      const select = document.getElementById('staffSelect');
      const list = document.getElementById('staffList');
      select.innerHTML = '<option value="">-- เลือกพนักงาน (เพื่อระบุตัวตน) --</option>';
      list.innerHTML = "";
      appData.staff.forEach(s => {
        select.innerHTML += `<option value="${s[0]}">${s[0]}</option>`;
        list.innerHTML += `<div class="flex justify-between items-center p-4 hover:bg-slate-50 transition-colors rounded-xl"><div><p class="font-bold text-sm text-slate-700">${s[0]}</p><p class="text-[9px] uppercase text-slate-400 font-bold">${s[1] || ""}</p></div><button onclick="delStaff('${s[0]}')" class="text-rose-400 p-2 font-bold hover:text-rose-600 transition">ลบ</button></div>`;
      });
    }

    async function handleMonthYearChange() {
      const m = document.getElementById('runMonth').value, y = document.getElementById('runYear').value;
      document.getElementById('sub-header').innerText = `ประจำเดือน ${mNames[m]} พ.ศ. ${parseInt(y)+543}`;
      const savedData = await callAPI('loadSchedule', 'GET', { month: m, year: y });
      if (savedData) {
        currentSchedule = savedData.schedule;
        currentTargets = savedData.targets;
        currentWorkDays = savedData.workDays;
      } else {
        currentSchedule = constructInitialDraft(m, y);
      }
      renderTable();
    }

    function constructInitialDraft(m, y) {
      const days = new Date(y, parseInt(m) + 1, 0).getDate();
      let skeleton = [];
      for (let d = 1; d <= days; d++) {
        const dStr = `${y}-${String(parseInt(m) + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        let dayAssigns = [];
        appData.staff.forEach(s => {
          const b = appData.bookings.find(bk => bk.date === dStr && bk.name.trim() === s[0].trim());
          if (b) dayAssigns.push({ name: s[0].trim(), type: b.type, isSupp: b.type.includes('*'), isBooked: true });
        });
        skeleton.push({ date: dStr, assignments: dayAssigns });
      }
      return skeleton;
    }

    function clearScheduleUI() {
      Swal.fire({
        title: 'ยืนยันการล้างตาราง?',
        text: "ระบบจะลบเวรที่ AI จัดให้ทั้งหมด แต่จะยังคงเวรที่จองไว้ในหน้าปฏิทิน",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#f97316',
        confirmButtonText: 'ล้างข้อมูล',
        cancelButtonText: 'ยกเลิก'
      }).then((result) => {
        if (result.isConfirmed) {
          currentSchedule.forEach(day => {
            day.assignments = day.assignments.filter(a => a.isBooked);
          });
          renderTable();
          Swal.fire({ title: 'ล้างข้อมูลสำเร็จ', icon: 'success', timer: 800, showConfirmButton: false });
        }
      });
    }

    async function processAuto() {
      const m = parseInt(document.getElementById('runMonth').value), y = parseInt(document.getElementById('runYear').value);
      const extraH = Array.from(document.querySelectorAll('.extra-h:checked')).map(el => el.value);
      const q = {
        wd_r_n: document.getElementById('q_wd_r_n').value, wd_r_m: document.getElementById('q_wd_r_m').value, wd_r_a: document.getElementById('q_wd_r_a').value,
        wd_s_n: document.getElementById('q_wd_s_n').value, wd_s_m: document.getElementById('q_wd_s_m').value, wd_s_a: document.getElementById('q_wd_s_a').value,
        hd_r_n: document.getElementById('q_hd_r_n').value, hd_r_m: document.getElementById('q_hd_r_m').value, hd_r_a: document.getElementById('q_hd_r_a').value,
        hd_s_n: document.getElementById('q_hd_s_n').value, hd_s_m: document.getElementById('q_hd_s_m').value, hd_s_a: document.getElementById('q_hd_s_a').value
      };
      Swal.fire({ title: 'กำลังคำนวณเวรตามนาฬิกาชีวภาพ...', didOpen: () => Swal.showLoading(), showConfirmButton: false });
      const res = await callAPI('generate', 'POST', { month: m, year: y, extraHolidays: extraH, q });
      if (res) {
        currentSchedule = res.schedule; 
        currentWorkDays = res.workDays; 
        currentTargets = res.targets; 
        renderTable(); 
      }
      Swal.close(); 
    }

    async function saveSchedule() {
      const m = document.getElementById('runMonth').value, y = document.getElementById('runYear').value;
      Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading(), showConfirmButton: false });
      await callAPI('saveSchedule', 'POST', { month: m, year: y, schedule: currentSchedule, targets: currentTargets, workDays: currentWorkDays });
      Swal.fire({ title: 'สำเร็จ', icon: 'success', timer: 1000, showConfirmButton: false });
    }

    function renderTable() {
      const m = document.getElementById('runMonth').value, y = document.getElementById('runYear').value;
      const extraH = Array.from(document.querySelectorAll('.extra-h:checked')).map(el => el.value);
      const days = new Date(y, parseInt(m) + 1, 0).getDate();
      const head = document.getElementById('dutyHead'), body = document.getElementById('dutyBody');
      head.innerHTML = ""; body.innerHTML = "";

      let h1 = `<tr><th rowspan="3">ลำดับ</th><th rowspan="3" class="min-w-[120px]">ชื่อ - สกุล</th><th rowspan="3" class="min-w-[80px]">ตำแหน่ง</th>`, h2 = `<tr>`;
      for(let d=1; d<=days; d++) {
        const dObj = new Date(y, m, d), isH = (dObj.getDay() === 0 || dObj.getDay() === 6 || extraH.includes(d.toString().padStart(2,'0')));
        h1 += `<th class="${isH ? 'bg-holiday' : ''}">${d.toString().padStart(2,'0')}</th>`;
        h2 += `<th class="${isH ? 'bg-holiday' : ''}">${dNames[dObj.getDay()]}</th>`;
      }
      h1 += `<th colspan="3">เวรจริง</th><th rowspan="3">เสริม</th><th rowspan="3">รวม</th><th rowspan="3">หยุด</th><th rowspan="3">OT</th></tr><tr class="h-0">`;
      for(let d=1; d<=days; d++) h2 += `<th class="${(new Date(y, m, d).getDay() === 0 || new Date(y, m, d).getDay() === 6 || extraH.includes(d.toString().padStart(2,'0'))) ? 'bg-holiday' : ''}"></th>`;
      h2 += `<th>ด</th><th>ช</th><th>บ</th></tr>`;
      head.innerHTML = h1 + h2;

      let dailyTotals = Array.from({length: days}, () => ({'ด':0, 'ช':0, 'บ':0}));
      appData.staff.forEach((s, idx) => {
        let row = `<tr><td>${idx+1}</td><td class="text-left font-bold px-1 truncate">${s[0]}</td><td class="text-[8px] uppercase text-slate-400 font-bold">${s[1] || ""}</td>`;
        let c = { n:0, m:0, a:0, supp:0, off:0 };
        for(let d=1; d<=days; d++) {
          const userDuty = currentSchedule[d-1]?.assignments.find(a => a.name.trim() === s[0].trim());
          let selVal = userDuty ? userDuty.type : "";
          if(selVal && !['Off','VAC','อบรม'].includes(selVal)) {
            if(selVal.includes('ด')) { c.n++; dailyTotals[d-1]['ด']++; }
            if(selVal.includes('ช')) { c.m++; dailyTotals[d-1]['ช']++; }
            if(selVal.includes('บ')) { c.a++; dailyTotals[d-1]['บ']++; }
            if(selVal.includes('*')) c.supp++;
          } else { c.off++; }
          const isH = (new Date(y, m, d).getDay() === 0 || new Date(y, m, d).getDay() === 6 || extraH.includes(d.toString().padStart(2,'0')));
          row += `<td class="${isH ? 'bg-holiday' : ''} ${userDuty?.isBooked ? 'cell-booked' : ''}"><select class="select-shift" onchange="handleShiftChange('${s[0]}', ${d-1}, this)">`;
          ["", "ด", "ด*", "ช", "ช*", "บ", "บ*", "ดบ", "ชบ", "Off", "VAC", "อบรม"].forEach(o => { row += `<option value="${o}" ${selVal === o ? 'selected' : ''}>${o}</option>`; });
          row += `</select></td>`;
        }
        let total = c.n + c.m + c.a + c.supp;
        row += `<td>${c.n}</td><td>${c.m}</td><td>${c.a}</td><td>${c.supp}</td><td class="bg-blue-50 font-bold text-blue-800">${total}</td><td class="bg-slate-50 text-slate-400 font-bold">${c.off}</td><td class="font-bold text-indigo-600">${currentWorkDays ? total - currentWorkDays : 0}</td></tr>`;
        body.innerHTML += row;
      });
    }

    function handleShiftChange(name, dIdx, el) {
      if (!currentSchedule[dIdx]) currentSchedule[dIdx] = { assignments: [] };
      let existing = currentSchedule[dIdx].assignments.find(a => a.name === name);
      if (existing) {
        if (el.value === "") currentSchedule[dIdx].assignments = currentSchedule[dIdx].assignments.filter(a => a.name !== name);
        else {
          existing.type = el.value;
          existing.isSupp = el.value.includes('*');
          existing.isBooked = false; // ถ้าแก้เอง ถือว่าเป็นเวรจัด
        }
      } else if (el.value !== "") {
        currentSchedule[dIdx].assignments.push({ name, type: el.value, isSupp: el.value.includes('*'), isBooked: false });
      }
      renderTable();
    }

    function updateCurrentStaff() { currentStaff = document.getElementById('staffSelect').value; renderCalendar(); }

    function renderCalendar() {
      const m = parseInt(document.getElementById('bookMonth').value), y = parseInt(document.getElementById('bookYear').value);
      const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
      const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
      dNames.forEach(d => grid.innerHTML += `<div class="bg-white p-3 text-center text-xs font-bold text-slate-500 border-b border-slate-100">${d}</div>`);
      for(let i=0; i<first; i++) grid.innerHTML += `<div class="calendar-day bg-slate-50 opacity-40"></div>`;
      for(let d=1; d<=days; d++) {
        const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const bks = appData.bookings.filter(b => b.date === dStr);
        let bkHtml = bks.map(b => `<div class="tag-booking type-${b.type} ${b.name === currentStaff ? 'ring-2 ring-white scale-110 shadow-md' : 'opacity-80'}">${b.name} (${b.type})</div>`).join('');
        grid.innerHTML += `<div class="calendar-day p-2" onclick="showDayDetails('${dStr}')"><span class="text-xs font-bold text-slate-300">${d}</span><div class="mt-1">${bkHtml}</div></div>`;
      }
    }

    async function showDayDetails(date) {
      const bks = appData.bookings.filter(b => b.date === date);
      const myBk = bks.find(b => b.name.trim() === currentStaff.trim());
      let html = `<div class="text-left overflow-x-auto mb-4"><table class="w-full text-xs border-collapse border border-slate-200"><thead><tr class="bg-slate-100"><th class="border p-2 text-left">ชื่อ-นามสกุล</th><th class="border p-2 text-center">ประเภทเวร</th></tr></thead><tbody>`;
      if (bks.length === 0) html += `<tr><td colspan="2" class="border p-4 text-center italic text-slate-400">ยังไม่มีการจองในวันนี้</td></tr>`;
      else bks.forEach(b => { html += `<tr class="${b.name === currentStaff ? 'bg-blue-50 font-bold text-blue-700' : ''}"><td class="border p-2">${b.name}</td><td class="border p-2 text-center"><span class="tag-booking type-${b.type} px-2 py-0.5 inline-block">${b.type}</span></td></tr>`; });
      html += `</tbody></table></div>`;
      
      const res = await Swal.fire({ 
        title: `ข้อมูลวันที่ ${date}`, 
        html, 
        showCancelButton: true, 
        cancelButtonText: 'ปิด',
        showConfirmButton: currentStaff ? true : false,
        confirmButtonText: myBk ? 'แก้ไขการจองของฉัน' : 'เพิ่มการจอง',
        confirmButtonColor: myBk ? '#f59e0b' : '#3b82f6', 
        showDenyButton: myBk ? true : false, 
        denyButtonText: 'ลบการจอง',
        footer: !currentStaff ? '<span class="text-rose-500 font-bold text-xs underline">โปรดเลือกพนักงานที่ด้านบนก่อนดำเนินการจอง</span>' : ''
      });
      
      if (res.isConfirmed) submitBook(date, myBk ? myBk.type : "");
      else if (res.isDenied) delBook(date);
    }

    async function submitBook(date, existing = "") {
      if(!currentStaff) return Swal.fire('โปรดเลือกพนักงานก่อน', '', 'warning');
      const { value: type } = await Swal.fire({ 
        title: 'จองเวร ' + date, 
        input: 'select', 
        inputOptions: { 'ด':'ดึก','ช':'เช้า','บ':'บ่าย','ดบ':'ดบ','ชบ':'ชบ','Off':'Off','VAC':'VAC','อบรม':'อบรม' }, 
        inputValue: existing, 
        showCancelButton: true,
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#2563eb'
      });
      if(type) { 
        Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading(), showConfirmButton: false });
        if(existing) await callAPI('deleteBooking', 'POST', { date, name: currentStaff }); 
        await callAPI('saveBooking', 'POST', { data: {date, name:currentStaff, type} }); 
        refresh(); 
        Swal.fire({ title: 'บันทึกสำเร็จ', icon: 'success', timer: 800, showConfirmButton: false });
      }
    }

    async function delBook(date) { 
      Swal.fire({ title: 'กำลังลบ...', didOpen: () => Swal.showLoading(), showConfirmButton: false });
      await callAPI('deleteBooking', 'POST', { date, name: currentStaff }); 
      refresh();
      Swal.fire({ title: 'ลบสำเร็จ', icon: 'success', timer: 800, showConfirmButton: false });
    }

    function buildHolidayChecks() {
       const m = parseInt(document.getElementById('runMonth').value), y = parseInt(document.getElementById('runYear').value);
       const container = document.getElementById('holidayCheck'); container.innerHTML = "";
       for(let d=1; d<=new Date(y, m+1, 0).getDate(); d++) {
         if(new Date(y, m, d).getDay() !== 0 && new Date(y, m, d).getDay() !== 6) 
           container.innerHTML += `<label class="bg-white p-1 rounded border text-[9px] cursor-pointer hover:bg-blue-50 transition border-slate-200"><input type="checkbox" onchange="renderTable()" value="${d.toString().padStart(2,'0')}" class="extra-h mr-1">${d}</label>`;
       }
    }

    function exportExcel() {
       const table = document.getElementById("mainTable").cloneNode(true);
       table.querySelectorAll('select').forEach(sel => { sel.parentNode.replaceChild(document.createTextNode(sel.value), sel); });
       XLSX.writeFile(XLSX.utils.table_to_book(table), `Schedule_${Date.now()}.xlsx`);
    }

    async function addStaff() { 
      if (!document.getElementById('inName').value) return;
      await callAPI('manageStaff', 'POST', { subAction: 'add', data: {name: document.getElementById('inName').value, pos: document.getElementById('inPos').value} }); 
      document.getElementById('inName').value = ""; 
      document.getElementById('inPos').value = ""; 
      refresh(); 
    }
    
    async function delStaff(n) { 
      const res = await callAPI('manageStaff', 'POST', { subAction: 'delete', data: {name: n} }); 
      if (res) refresh(); 
    }
  </script>
</body>
</html>
